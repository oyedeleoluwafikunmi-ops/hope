<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your cart | Mira</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/cart.css">
  </head>
  <body>
    <header class="app-header">
      <div class="wrapper app-header-inner">
        <a class="brand" href="index.html">
          <span>m</span>
          <span>i</span>
          <span>r</span>
          <span>a</span>
        </a>
        <nav class="app-nav">
          <a href="browse.html">Browse</a>
          <a href="watchlist.html">Watchlist</a>
          <a href="sell.html">Sell</a>
          <a href="help.html">Help</a>
        </nav>
        <div class="header-actions">
          <a href="cart.html" aria-current="page">Cart <b id="cart-count">0</b>
        </a>
        <a href="account.html">My Mira</a>
      </div>
    </div>
  </header>
  <main class="inner-page">
    <div class="wrapper">
      <h1 class="page-title">Your cart</h1>
      <div class="cart-layout">
        <section class="content-card" id="cart-items">
        </section>
        <aside class="content-card order-summary">
          <h2>Order summary</h2>
          <div class="summary-row">
            <span>Items</span>
            <span id="cart-total">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>Free</span>
          </div>
          <hr>
          <div class="summary-row">
            <strong>Total</strong>
            <strong id="cart-total-copy">$0.00</strong>
          </div>
          <button class="checkout-button" id="checkout">Checkout</button>
        </aside>
      </div>
    </div>
  </main>
  <footer class="app-footer">
    <div class="wrapper app-footer-inner">
      <a class="brand" href="index.html">
        <span>m</span>
        <span>i</span>
        <span>r</span>
        <span>a</span>
      </a>
      <div class="app-footer-links">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="watchlist.html">Watchlist</a>
        <a href="sell.html">Sell</a>
        <a href="help.html">Help</a>
      </div>
      <p>© 2026 Mira Marketplace Demo</p>
    </div>
  </footer>
  <script src="assets/js/pages.js">
  </script>
</body>
</html>
