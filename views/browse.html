    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

            <button onclick="location.href='browse.html?category=All%20Categories'">All categories</button>
          </div>
        </aside>
        <section class="results-grid" id="results">
        </section>
